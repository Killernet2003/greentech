<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greentech · Portal del equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--suelo:#EEF1EA;--tinta:#0F1D17;--suave:#4A5A50;--verde:#1F7A4C;--verde-5:#D4EEDB;--lima:#B8E04A;--ambar:#F5A524;--borde:#D3DAD0;--panel:#FFFFFF;--rojo:#B3261E;
--f-disp:"Unbounded",system-ui,sans-serif;--f-txt:"Manrope",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--suelo);color:var(--tinta);font:400 15px/1.5 var(--f-txt);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--verde);font-weight:700}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.lateral{background:var(--tinta);color:var(--suelo);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.marca{display:flex;align-items:center;gap:10px;font:700 17px/1 var(--f-disp);padding:6px 10px 18px}
.marca i{width:14px;height:14px;background:var(--lima);display:block;clip-path:polygon(4px 0,10px 0,14px 4px,14px 10px,10px 14px,4px 14px,0 10px,0 4px)}
.grupo{font-size:12px;font-weight:700;color:#9FB3A6;padding:16px 10px 6px}
.enlace{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:6px;cursor:pointer;color:#E6ECE7;font-weight:600;font-size:14px}
.enlace:hover{background:#1C3127}
.enlace[aria-current=page]{background:var(--lima);color:var(--tinta)}
.enlace .n{font-size:12px;font-weight:700;opacity:.75;font-variant-numeric:tabular-nums}
.sub{padding-left:22px;font-weight:500}
.quien{margin-top:auto;padding:16px 10px 4px;font-size:13px;color:#B9C8BE;border-top:1px solid #23392E}
.principal{padding:28px clamp(16px,3vw,40px) 64px;min-width:0}
.cabeza{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.cabeza h1{font:700 26px/1.15 var(--f-disp);margin:0}
.cabeza p{margin:6px 0 0;color:var(--suave);max-width:70ch}
.boton{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:0;border-radius:6px;background:var(--verde);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
.boton.sec{background:var(--panel);color:var(--tinta);border:1px solid var(--borde)}
.boton.peligro{background:var(--rojo)}
.herramientas{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.herramientas input,.herramientas select{min-height:40px;padding:0 12px;border:1px solid var(--borde);border-radius:6px;background:var(--panel)}
.herramientas input{flex:1;min-width:220px}
.marco{background:var(--panel);border:1px solid var(--borde);border-radius:8px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #E6EAE3;vertical-align:top}
thead th{font-size:12px;color:var(--suave);font-weight:700;background:#F7F9F5;position:sticky;top:0}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
tr:hover td{background:#FAFBF8}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--verde-5);color:var(--verde);white-space:nowrap}
.chip.online{background:#E4EEFB;color:#1F4E8C}.chip.estimado{background:#FCEFD6;color:#8A5A00}.chip.cotizacion{background:var(--verde-5);color:var(--verde)}
.chip.abierta,.chip.nueva,.chip.programada{background:#FCEFD6;color:#8A5A00}.chip.cerrada,.chip.terminada,.chip.aceptada,.chip.activo{background:var(--verde-5);color:var(--verde)}
.acciones{white-space:nowrap}
.acciones button{background:none;border:0;color:var(--verde);font-weight:700;cursor:pointer;padding:2px 6px}
.vacio{padding:40px 20px;text-align:center;color:var(--suave)}
.aviso{background:#FCEFD6;border:1px solid #F2D28F;color:#5C3D00;padding:12px 14px;border-radius:8px;margin-bottom:16px}
.tarjetas{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.tarjeta{background:var(--panel);border:1px solid var(--borde);border-radius:8px;padding:16px;cursor:pointer;text-align:left}
.tarjeta b{display:block;font:700 30px/1 var(--f-disp);margin:8px 0 4px;font-variant-numeric:tabular-nums}
.tarjeta span{color:var(--suave);font-size:13px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.caja{background:var(--panel);border:1px solid var(--borde);border-radius:8px;padding:16px}
.caja h2{font:700 15px/1.2 var(--f-disp);margin:0 0 12px}
.lista-mini{list-style:none;margin:0;padding:0}
.lista-mini li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #EDF0EA;font-size:14px}
dialog{border:0;border-radius:10px;padding:0;width:min(640px,94vw);box-shadow:0 20px 60px rgba(15,29,23,.25)}
dialog::backdrop{background:rgba(15,29,23,.45)}
.form{padding:22px}
.form h2{font:700 18px/1.2 var(--f-disp);margin:0 0 16px}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.campos label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700}
.campos .ancho{grid-column:1/-1}
.campos input,.campos select,.campos textarea{padding:9px 10px;border:1px solid var(--borde);border-radius:6px;background:#fff;font-weight:500;font-size:14px}
.campos textarea{min-height:80px;resize:vertical}
.pie-form{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.calendario{background:var(--panel);border:1px solid var(--borde);border-radius:8px}
.cal-cabeza{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--borde)}
.cal-cabeza h2{font:700 16px/1 var(--f-disp);margin:0;text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-dia{min-height:104px;border-right:1px solid #EDF0EA;border-bottom:1px solid #EDF0EA;padding:6px;font-size:12px}
.cal-dia:nth-child(7n){border-right:0}
.cal-dia.fuera{background:#F7F9F5;color:#9AA79F}
.cal-dia.hoy .d{background:var(--tinta);color:#fff;border-radius:999px;padding:0 6px}
.cal-dia .d{font-weight:800;display:inline-block;margin-bottom:4px}
.cal-sem{font-size:12px;font-weight:700;color:var(--suave);padding:8px 6px;border-bottom:1px solid var(--borde)}
.ev{display:block;width:100%;text-align:left;border:0;border-radius:4px;padding:2px 6px;margin-bottom:3px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.instalacion{background:var(--verde-5);color:var(--verde)}.ev.evento{background:#FCEFD6;color:#8A5A00}
.leyenda{display:flex;gap:14px;font-size:13px;color:var(--suave);margin:10px 2px}
.leyenda span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.leyenda .li::before{background:var(--verde-5)}.leyenda .le::before{background:#FCEFD6}
.correo{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.correo a{display:block;background:var(--panel);border:1px solid var(--borde);border-radius:8px;padding:18px;text-decoration:none;color:var(--tinta)}
.correo a b{display:block;font:700 15px/1.2 var(--f-disp);margin-bottom:6px}
.correo a span{color:var(--suave);font-size:13px;font-weight:500}
.cat{display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:20px;align-items:start}
.cat-listas{display:grid;gap:18px}
.cat-grupo{background:var(--panel);border:1px solid var(--borde);border-radius:8px;padding:8px}
.cat-grupo h2{font:700 14px/1.2 var(--f-disp);margin:6px 8px 8px}
.cat-fila{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px}
.cat-fila:hover{background:#F2F5EF}
.cat-fila[aria-current=true]{background:var(--verde-5);color:var(--verde)}
.cat-fila small{color:var(--suave);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.ficha{position:sticky;top:20px;background:var(--panel);border:1px solid var(--borde);border-radius:8px;padding:20px}
.ficha h2{font:700 20px/1.2 var(--f-disp);margin:0 0 4px}
.ficha-tipo{color:var(--verde);font-weight:700;margin:0 0 12px}
.ficha table{margin:8px 0}
.ficha th{width:42%;color:var(--suave);font-weight:600;background:none;position:static}
.ficha ul{margin:10px 0 0;padding-left:18px}
.ficha li{margin:4px 0}
.sello{margin:0 0 6px;padding:8px 12px;border-radius:6px;background:var(--verde);color:#fff;font-weight:700;font-size:13px}
.sello-off{background:var(--tinta)}.sello-falta{background:var(--ambar);color:var(--tinta)}
.cat-det{padding:4px 8px 12px}
.menu-movil{display:none}
.acceso{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--tinta)}
.acceso[hidden]{display:none!important}
.acceso-caja{width:min(400px,100%);background:var(--panel);border-radius:12px;padding:28px 24px}
.acceso-caja .marca{color:var(--tinta);padding:0 0 18px}
.acceso-caja h1{font:700 20px/1.2 var(--f-disp);margin:0 0 6px}
.acceso-caja p{color:var(--suave);margin:0 0 16px;font-size:14px}
.acceso-caja label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;margin-bottom:12px}
.acceso-caja input{padding:10px 12px;border:1px solid var(--borde);border-radius:6px;font-size:15px;font-weight:500}
.acceso-caja .boton{width:100%;justify-content:center;margin-top:4px}
.acceso-caja .enlace-txt{display:block;margin-top:14px;background:none;border:0;padding:0;color:var(--verde);font-weight:700;cursor:pointer;font-size:14px}
.acceso-msg{padding:10px 12px;border-radius:6px;font-size:14px;margin-bottom:12px;background:#FCEFD6;color:#5C3D00}
.acceso-msg.ok{background:var(--verde-5);color:var(--verde)}
.volver-web{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--suave)}
.salir{display:block;margin-top:8px;background:none;border:0;padding:0;color:var(--lima);font-weight:700;cursor:pointer;font-size:13px}
a.enlace{text-decoration:none}
.rol select{padding:6px 8px;border:1px solid var(--borde);border-radius:6px;background:#fff}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .lateral{position:fixed;inset:0 30% 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s;height:auto}
  .lateral.abierta{transform:none}
  .menu-movil{display:flex;align-items:center;justify-content:space-between;background:var(--tinta);color:var(--suelo);padding:12px 16px;position:sticky;top:0;z-index:10}
  .menu-movil button{background:var(--lima);border:0;border-radius:6px;padding:8px 12px;font-weight:800}
  .cat{grid-template-columns:1fr} .cat>.ficha{display:none}
  .tarjetas{grid-template-columns:1fr 1fr}.dos,.correo{grid-template-columns:1fr}
  .campos{grid-template-columns:1fr}
  .cal-dia{min-height:70px;padding:3px}.ev{font-size:10px;padding:1px 3px}
}
</style>
</head>
<body>
<div class="acceso" id="acceso">
  <form class="acceso-caja" id="form-acceso" novalidate>
    <div class="marca"><i></i>Greentech</div>
    <h1 id="acceso-titulo">Portal del equipo técnico</h1>
    <p id="acceso-sub">Entra con el correo y la contraseña que te dio Greentech.</p>
    <div class="acceso-msg" id="acceso-msg" role="status" hidden></div>
    <label id="campo-correo">Correo<input type="email" name="correo" autocomplete="username" required></label>
    <label id="campo-clave">Contraseña<input type="password" name="clave" autocomplete="current-password" minlength="8" required></label>
    <button class="boton" type="submit" id="acceso-boton">Entrar</button>
    <button class="enlace-txt" type="button" id="olvide">Olvidé mi contraseña</button>
    <button class="enlace-txt" type="button" id="acceso-salir" hidden>Cerrar sesión</button>
    <a class="volver-web" href="../">← Volver a la web de Greentech</a>
  </form>
</div>
<div id="portal" hidden>
<div class="menu-movil"><span class="marca" style="padding:0"><i></i>Greentech</span><button type="button" id="abrir-menu" aria-expanded="false">Menú</button></div>
<div class="app">
  <nav class="lateral" id="lateral" aria-label="Menú del portal">
    <div class="marca"><i></i>Greentech</div>
    <button class="enlace" data-ir="inicio">Inicio</button>
    <div class="grupo">Equipos</div>
    <button class="enlace" data-ir="catalogo">Inversores y paneles <span class="n" id="n-catalogo"></span></button>
    <div class="grupo">Proveedores</div>
    <div id="menu-segmentos"></div>
    <button class="enlace" data-ir="proveedores">Otros proveedores <span class="n" data-cuenta="proveedores"></span></button>
    <div class="grupo">Operación</div>
    <button class="enlace" data-ir="cotizaciones">Solicitud de cotizaciones <span class="n" data-cuenta="cotizaciones"></span></button>
    <button class="enlace" data-ir="calendario">Calendario de instalaciones</button>
    <button class="enlace" data-ir="instalaciones">Instalaciones <span class="n" data-cuenta="instalaciones"></span></button>
    <button class="enlace" data-ir="eventos">Eventos <span class="n" data-cuenta="eventos"></span></button>
    <button class="enlace" data-ir="pqr">Buzón de PQR <span class="n" data-cuenta="pqr"></span></button>
    <button class="enlace" data-ir="aliados">Aliados <span class="n" data-cuenta="aliados"></span></button>
    <button class="enlace" data-ir="webmail">Webmail</button>
    <button class="enlace" data-ir="equipo" id="menu-equipo" hidden>Equipo y permisos</button>
    <a class="enlace" href="../">Volver a la web</a>
    <div class="quien"><span id="quien">Conectando…</span><button type="button" class="salir" id="salir">Cerrar sesión</button></div>
  </nav>
  <main class="principal" id="principal"></main>
</div>

</div>

<dialog id="dialogo"><form class="form" id="formulario" method="dialog"></form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>

    if (c === "inv") {
      var red = (x.certificaciones || []).filter(function (k) { return /UL\s*1741|62109/i.test(k); });
      sello = x.tipo === "offgrid" ? '<p class="sello sello-off">Off grid: no inyecta a la red, no necesita certificado de conexión del operador.</p>'
        : red.length ? '<p class="sello">Certificado para conexión a la red · ' + esc(red.join(" · ")) + "</p>"
        : '<p class="sello sello-falta">La ficha no muestra UL 1741 ni IEC 62109: el operador de red puede no aprobarlo.</p>';
    }
    var vent = (x.ventajas || x.otras_ventajas || []).map(function (v) { return "<li>" + esc(v) + "</li>"; }).join("");
    var inf = (x.campos_inferidos || []).length ? '<p style="color:var(--suave);font-size:13px">No salen de la ficha: ' + esc(x.campos_inferidos.join(", ")) + "</p>" : "";
    return "<h2>" + esc(x.marca + " " + x.modelo) + '</h2><p class="ficha-tipo">' + (c === "panel" ? "Panel solar" : c === "bat" ? "Batería" : TIPOS[x.tipo] || "Inversor") + "</p>" + sello +
      "<table>" + f + "</table>" + (vent ? "<ul>" + vent + "</ul>" : "") + (x.notas ? '<p style="font-size:14px">' + esc(x.notas) + "</p>" : "") + inf +
      (x.url_ficha ? "<p>" + url(x.url_ficha, "Ficha técnica del fabricante") + ' <span style="color:var(--suave)">(inglés)</span><br>' + trad(x.url_ficha) + '<br><small style="color:var(--suave)">La traducción es automática (Google Translate): revisa las cifras importantes en el original.</small></p>' : "");
  }
  function resumen(x, c) {
    if (c === "bat") return (x.kwh ? num(x.kwh, 2) + " kWh" : "") + (x.ciclos ? " · " + ((String(x.ciclos).match(/\d[\d.]*/) || [""])[0]) + " ciclos" : "");
    if (c === "panel") { var p = x.potencia_w && typeof x.potencia_w === "object" ? x.potencia_w.rango : x.potencia_w; return String(p || "").replace(/~/g, "–") + " W · " + (x.garantia_producto_anios || "—") + " años"; }
    return (x.potencia_ac_w ? num(x.potencia_ac_w / 1000, 1) + " kW" : "") + " · " + (x.garantia_anios || "—") + " años";
  }
  function catalogo() {
    if (!ITEMS.length) return '<div class="cabeza"><div><h1>Inversores y paneles</h1></div></div><p class="vacio">El catálogo de equipos no está disponible.</p>';
    var q = (vista.q || "").toLowerCase(), i = 0;
    var listas = GRUPOS.map(function (g) {
      var filas = g[1].map(function (x) {
        var k = i++; if (q && JSON.stringify(x).toLowerCase().indexOf(q) < 0) return "";
        return '<button type="button" class="cat-fila" data-cat="' + k + '"' + (k === catSel ? ' aria-current="true"' : "") + ">" + esc(x.marca + " " + x.modelo) + "<small>" + esc(resumen(x, g[2])) + "</small></button>" +
          '<div class="cat-det" data-det="' + k + '" hidden></div>';
      }).join("");
      return filas ? '<div class="cat-grupo"><h2>' + g[0] + "</h2>" + filas + "</div>" : "";
    }).join("") || '<p class="vacio">Ningún equipo coincide con la búsqueda.</p>';
    return '<div class="cabeza"><div><h1>Inversores y paneles</h1><p>Fichas técnicas de los equipos de referencia de Greentech' + (EQ.fecha ? ", revisadas el " + esc(EQ.fecha) : "") +
      '. Toca un modelo para ver su ficha. Los precios son aproximados: confírmalos antes de cotizar.</p></div></div>' +
      '<div class="herramientas"><input type="search" id="buscar-cat" placeholder="Buscar por marca, modelo, certificación…" value="' + esc(vista.q || "") + '"></div>' +
      '<div class="cat"><div class="cat-listas">' + listas + '</div><aside class="ficha" id="ficha" aria-live="polite">' + fichaHTML(ITEMS[catSel][0], ITEMS[catSel][1]) + "</aside></div>";
  }
  function enlazarCatalogo() {
    var b = $("#buscar-cat"); if (b) b.addEventListener("input", function () { vista.q = b.value; var pos = b.selectionStart; pintar(); var nb = $("#buscar-cat"); nb.focus(); nb.setSelectionRange(pos, pos); });
    $$("[data-cat]").forEach(function (f) {
      f.addEventListener("click", function () {
        var k = +f.dataset.cat, it = ITEMS[k], movil = window.matchMedia("(max-width:900px)").matches;
        catSel = k;
        $$("[data-cat]").forEach(function (o) { if (o === f) o.setAttribute("aria-current", "true"); else o.removeAttribute("aria-current"); });
        if (movil) {
          var d = $('[data-det="' + k + '"]'), abierto = !d.hidden;
          $$("[data-det]").forEach(function (o) { o.hidden = true; });
          if (!abierto) { d.innerHTML = '<div class="ficha" style="position:static">' + fichaHTML(it[0], it[1]) + "</div>"; d.hidden = false; }
        } else { $("#ficha").innerHTML = fichaHTML(it[0], it[1]); }
      });
    });
  }

  /* ---------------- equipo y permisos (solo admin) ---------------- */
  var perfiles = [], ROLES = [["admin", "Administrador"], ["editor", "Editor"], ["lector", "Solo consulta"], ["pendiente", "Sin acceso"]];
  function cargarPerfiles() {
    return sb.from("perfiles").select("user_id,email,nombre,rol,creado").order("creado").then(function (r) { if (!r.error) perfiles = r.data; if (vista.pagina === "equipo") pintar(); });
  }
  function equipo() {
    var filas = perfiles.map(function (p) {
      var yo = sesion && p.user_id === sesion.user.id;
      return "<tr><td><b>" + esc(p.email || "") + "</b>" + (yo ? " <small>(tú)</small>" : "") + "</td><td>" + esc((p.creado || "").slice(0, 10)) + '</td><td class="rol"><select data-rol="' + esc(p.user_id) + '"' + (yo ? " disabled" : "") + ">" +
        ROLES.map(function (r) { return '<option value="' + r[0] + '"' + (r[0] === p.rol ? " selected" : "") + ">" + r[1] + "</option>"; }).join("") + "</select></td></tr>";
    }).join("");
    return '<div class="cabeza"><div><h1>Equipo y permisos</h1><p>Para dar acceso a un técnico: en Supabase entra a Authentication → Users → <b>Invite user</b> y escribe su correo. Le llega un enlace para crear su contraseña y aparece aquí como «Sin acceso» hasta que le asignes un rol.</p></div></div>' +
      '<p class="aviso" id="error-rol" hidden></p><div class="marco"><table><thead><tr><th scope="col">Correo</th><th scope="col">Desde</th><th scope="col">Rol</th></tr></thead><tbody>' +
      (filas || '<tr><td colspan="3" class="vacio">Cargando…</td></tr>') + "</tbody></table></div>" +
      '<p style="color:var(--suave);font-size:13px">Administrador: todo, incluidos los permisos. Editor: agrega y cambia registros. Solo consulta: ve sin cambiar nada.</p>';
  }
  function enlazarEquipo() {
    $$("[data-rol]").forEach(function (sel) {
      sel.addEventListener("change", function () {
        sb.from("perfiles").update({ rol: sel.value }).eq("user_id", sel.dataset.rol).select("user_id").then(function (r) {
          if (r.error || !r.data.length) { var e = $("#error-rol"); e.textContent = "No se pudo cambiar el rol."; e.hidden = false; }
          cargarPerfiles();
        });
      });
    });
  }

  /* ---------------- conexión con la base de datos (Supabase) ---------------- */
  var sb = null, sesion = null, rol = null, recargas = {};
  var CFG = window.GT_SUPABASE || {};
  /* el enlace de invitación o de recuperación trae type=invite / type=recovery */
  var crearClave = /type=(invite|recovery)/.test(location.hash + location.search);

  function falla(r) {
    if (r.error) { var e = new Error(r.error.message); e.code = r.error.code === "42501" ? "invalid_argument" : r.error.code; throw e; }
    if (r.data && !r.data.length) { var e2 = new Error("sin permiso"); e2.code = "invalid_argument"; throw e2; }
    return r;
  }
  function nuevoId() { return window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2); }
  async function leerColeccion(k) {
    var todos = [], desde = 0;
    for (;;) {
      var r = await sb.from("registros").select("id,datos").eq("coleccion", k).range(desde, desde + 999);
      if (r.error) throw r.error;
      todos = todos.concat(r.data);
      if (r.data.length < 1000) return todos;
      desde += 1000;
    }
  }
  /* misma forma que usaba el portal (colección → documento) sobre la tabla registros */
  function crearDB() {
    var oyentes = {};
    sb.channel("registros").on("postgres_changes", { event: "*", schema: "public", table: "registros" }, function (p) {
      var k = (p.new && p.new.coleccion) || (p.old && p.old.coleccion);
      (k ? [k] : Object.keys(oyentes)).forEach(function (c) {
        if (!oyentes[c]) return;
        clearTimeout(recargas[c]); recargas[c] = setTimeout(oyentes[c], 250);
      });
    }).subscribe();
    return { collection: function (k) {
      return {
        doc: function (id) {
          id = id || nuevoId();
          return {
            set: function (obj) { return sb.from("registros").upsert({ coleccion: k, id: id, datos: obj, actualizado: new Date().toISOString() }).select("id").then(falla); },
            delete: function () { return sb.from("registros").delete().eq("coleccion", k).eq("id", id).select("id").then(falla); }
          };
        },
        onSnapshot: function (cb, alFallar) {
          oyentes[k] = function () {
            leerColeccion(k).then(function (filas) {
              cb({ docs: filas.map(function (f) { return { id: f.id, data: function () { return f.datos || {}; } }; }), metadata: { fromCache: false } });
            }).catch(alFallar);
          };
          oyentes[k]();
        }
      };
    } };
  }

  /* ---------------- pantalla de acceso ---------------- */
  var fa = $("#form-acceso"), modo = "entrar";
  function mensaje(t, ok) { var m = $("#acceso-msg"); m.textContent = t || ""; m.hidden = !t; m.classList.toggle("ok", !!ok); }
  function modoAcceso(md, txt, ok) {
    modo = md;
    $("#acceso").hidden = false; $("#portal").hidden = true;
    var titulos = { entrar: ["Portal del equipo técnico", "Entra con el correo y la contraseña que te dio Greentech.", "Entrar"],
      olvido: ["Recuperar contraseña", "Te enviamos un enlace a tu correo para crear una nueva.", "Enviar enlace"],
      clave: ["Crea tu contraseña", "Mínimo 8 caracteres. La usarás para entrar al portal.", "Guardar contraseña"],
      espera: ["Cuenta sin permisos", "Tu cuenta ya existe, pero el administrador aún no te ha dado acceso al portal.", "Volver a intentar"],
      apagado: ["Portal en preparación", "El portal todavía no está conectado a la base de datos.", ""] }[md];
    $("#acceso-titulo").textContent = titulos[0]; $("#acceso-sub").textContent = titulos[1];
    $("#acceso-boton").textContent = titulos[2]; $("#acceso-boton").hidden = !titulos[2];
    $("#campo-correo").hidden = !(md === "entrar" || md === "olvido");
    $("#campo-clave").hidden = !(md === "entrar" || md === "clave");
    fa.elements.clave.autocomplete = md === "clave" ? "new-password" : "current-password";
    $("#olvide").hidden = md !== "entrar"; $("#olvide").textContent = "Olvidé mi contraseña";
    if (md === "olvido") { $("#olvide").hidden = false; $("#olvide").textContent = "Volver a entrar"; }
    $("#acceso-salir").hidden = md !== "espera";
    mensaje(txt, ok);
  }
  $("#olvide").addEventListener("click", function () { modoAcceso(modo === "olvido" ? "entrar" : "olvido"); });
  $("#acceso-salir").addEventListener("click", function () { sb.auth.signOut().then(function () { modoAcceso("entrar"); }); });
  $("#salir").addEventListener("click", function () { sb.auth.signOut().then(function () { location.reload(); }); });

  fa.addEventListener("submit", async function (e) {
    e.preventDefault();
    var correo = fa.elements.correo.value.trim(), clave = fa.elements.clave.value, b = $("#acceso-boton");
    b.disabled = true; mensaje("");
    try {
      if (modo === "entrar") {
        if (!correo || !clave) return mensaje("Escribe tu correo y tu contraseña.");
        var r = await sb.auth.signInWithPassword({ email: correo, password: clave });
        if (r.error) return mensaje(/invalid/i.test(r.error.message) ? "Correo o contraseña incorrectos." : /confirm/i.test(r.error.message) ? "Confirma tu correo con el enlace que te llegó." : "No se pudo entrar. Intenta de nuevo.");
        await entrar(r.data.session);
      } else if (modo === "olvido") {
        if (!correo) return mensaje("Escribe tu correo.");
        await sb.auth.resetPasswordForEmail(correo, { redirectTo: location.origin + location.pathname });
        modoAcceso("entrar", "Si el correo está registrado, te llegará un enlace para crear una nueva contraseña.", true);
      } else if (modo === "clave") {
        if (clave.length < 8) return mensaje("La contraseña debe tener al menos 8 caracteres.");
        var u = await sb.auth.updateUser({ password: clave });
        if (u.error) return mensaje("No se pudo guardar la contraseña: " + u.error.message);
        crearClave = false; history.replaceState(null, "", location.pathname);
        var s = await sb.auth.getSession(); await entrar(s.data.session);
      } else if (modo === "espera") {
        var s2 = await sb.auth.getSession(); await entrar(s2.data.session);
      }
    } finally { b.disabled = false; fa.elements.clave.value = ""; }
  });

  var conectado = false;
  async function entrar(s) {
    if (!s) return modoAcceso("entrar");
    sesion = s;
    if (crearClave) return modoAcceso("clave");
    var p = await sb.from("perfiles").select("rol,nombre,email").eq("user_id", s.user.id).maybeSingle();
    rol = p.data && p.data.rol;
    if (!rol || rol === "pendiente") return modoAcceso("espera", "Pide al administrador de Greentech que habilite tu cuenta (" + s.user.email + ").");
    esAdmin = rol === "admin"; puedeEscribir = rol === "admin" || rol === "editor";
    $("#acceso").hidden = true; $("#portal").hidden = false;
    $("#menu-equipo").hidden = !esAdmin;
    $("#quien").textContent = (p.data.nombre || s.user.email) + " · " + ({ admin: "Administrador", editor: "Editor", lector: "Solo consulta" }[rol]);
    if (conectado) return pintar();
    conectado = true;
    db = crearDB();
    if (esAdmin) cargarPerfiles();
    pintar();
    var limite = setTimeout(function () { cargado = true; pintar(); }, 10000);
    sb.from("registros").select("datos").eq("coleccion", "config").eq("id", "equipos").maybeSingle().then(function (r) {
      if (r.data) { prepararCatalogo(r.data.datos); if (vista.pagina === "catalogo") pintar(); else marcarMenu(); }
    });
    var pendientes = Object.keys(MOD).length;
    Object.keys(MOD).forEach(function (k) {
      db.collection(k).onSnapshot(function (snap) {
        datos[k] = snap.docs.map(function (d) { return Object.assign({ _id: d.id }, d.data()); });
        if (pendientes > 0) { pendientes--; if (!pendientes) { clearTimeout(limite); cargado = true; } }
        if (!$("#dialogo").open) pintar(); else marcarMenu();
      }, function () { cargado = true; pintar(); });
    });
  }

  if (!CFG.url || !CFG.anonKey || !window.supabase) {
    modoAcceso("apagado");
  } else {
    sb = window.supabase.createClient(CFG.url, CFG.anonKey);
    modoAcceso("entrar");
    sb.auth.onAuthStateChange(function (ev, s) {
      if (ev === "PASSWORD_RECOVERY") { crearClave = true; sesion = s; modoAcceso("clave"); }
      else if (ev === "SIGNED_OUT") { conectado = false; }
    });
    sb.auth.getSession().then(function (r) { if (r.data.session) entrar(r.data.session); });
  }
})();
</script>
</body>
</html>
